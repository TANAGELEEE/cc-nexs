name: preset-standard
version: 0.5.1
description: 通用多角色开发 SOP。默认 fast，显式 mode=full 时启用完整角色隔离；不绑定语言、框架、仓库名或组织规范。
language: zh-CN

# 默认 enabled 列表（向后兼容）。orchestrator 会按 all-docs/doc/<id>/config.json 的 mode 字段
# 选用 modes.<mode>.enabled 覆盖；未声明 mode 时回退到 modes.fast.enabled。
roles:
  enabled:
    - fullstack
    - reviewer
    - verifier

  definitions:
    # ===== full 模式角色 =====
    repo-scout:
      agent: agents/repo-scout-claude.md
      tool: claude-subagent
      alias: RepoScout
      session_isolation: independent

    planner:
      agent: agents/planner-claude.md
      tool: claude-subagent
      alias: Planner
      session_isolation: independent

    tech-lead:
      agent: agents/tech-lead-claude.md
      tool: claude-subagent
      alias: Tech Lead
      session_isolation: independent

    sa:
      agent: agents/sa-codex.md
      tool: codex
      alias: SA

    qa:
      agent: agents/qa-claude.md
      tool: claude-subagent
      alias: QA
      session_isolation: independent

    evaluator:
      agent: agents/evaluator-codex.md
      tool: codex
      alias: Evaluator

    # ===== 旁路角色（不进状态机循环，由独立命令触发）=====
    compound:
      agent: agents/compound-claude.md
      tool: claude-subagent
      alias: Compound
      session_isolation: independent
      # 旁路角色：仅在 /cc-nexs:compound 命令被显式调用时启动，状态机的 modes.*.enabled 不应包含 compound

    # ===== fast 模式角色（合并版）=====
    fullstack:
      agent: agents/fullstack-claude.md
      tool: claude-subagent
      alias: Fullstack
      session_isolation: independent

    reviewer:
      agent: agents/reviewer-codex.md
      tool: codex
      alias: Reviewer

    verifier:
      agent: agents/verifier-codex.md
      tool: codex
      alias: Verifier

# Runtime adaptation is capability-based, never tied to a literal model id.
# Claude Code keeps Claude implementer subagents + Codex CLI review roles.
# Codex maps every role to an independent native agent and never invokes Claude Code or nested Codex CLI.
runtimes:
  claude:
    model_policy: inherit
  codex:
    model_policy: inherit
    force_native_agents: true
    session_isolation: independent
  pi:
    model_policy: inherit
    force_pi_subagents: true
    session_isolation: independent

# 模式声明：每个 mode 列出自己的 enabled 列表与状态机骨架。
# orchestrator 启动时读需求目录的 config.json.mode 选择对应分支；fast 为默认，full 必须显式指定。
modes:
  full:
    description: 完整五方异构 + 现状勘察前置。Repo Scout 先扫 src/ 产 repo-context.md，再 Planner / Tech Lead / SA / QA / Evaluator 严格分离。
    enabled:
      - repo-scout
      - planner
      - tech-lead
      - sa
      - qa
      - evaluator
    state_machine: full
    sprint_enabled: true
    g2_enabled: true            # final_only 默认自动 test release；G2 仅作显式退出/前置不足 fallback

  fast:
    description: 单 sprint 三角色合并。Fullstack（Planner+Tech Lead）/ Reviewer（SA+Evaluator）/ Verifier（QA cases+run+regression）。
    enabled:
      - fullstack
      - reviewer
      - verifier
    state_machine: fast
    g2_enabled: true            # final_only 默认自动 test release；G2 仅作显式退出/前置不足 fallback
    sprint_enabled: false      # fast 模式强制单 sprint，无需 sprint 切片
    thresholds_override:
      review_revision: 2       # 比 full 更严：2 轮即熔断
      fix_per_bug: 2
      evaluator_reject: 2

stack:
  type: generic
  # 项目通过 cc-nexs.config.yml 或私有 overlay 注入真实命令和路径。
  build_cmd: ""
  test_cmd: ""
  lint_cmd: ""
  src_paths:
    - "src/**"
    - "**/src/**"
  forbidden_patterns: []
  custom_review_rules:
    - "实现必须覆盖验收契约，且不得通过放宽测试规避失败"
    - "外部输入、网络、存储和进程边界必须有明确错误处理"
    - "并发、事务、权限和数据迁移风险必须有对应验证或回滚方案"
    - "遵守目标仓库自身的 AGENTS.md、CLAUDE.md 和本地 overlay 规则"

paths:
  doc_dir: "all-docs/doc/{id}.{slug}/"
  doc_repo: "all-docs/"
  doc_repo_branch: "main"
  branch_pattern: "feature/{id}-{slug}"
  bugs_dir: "bugs/"

workflow:
  sprint_enabled: true
  human_gate_after: spec_reviewing_pass
  sprint_delivery: final_only
  test_release:
    policy: auto_if_ready
    on_prerequisite_failure: manual_gate
  thresholds:
    review_revision: 3
    fix_per_bug: 3
    evaluator_reject: 2

release:
  test:
    environment: test
    driver: null
    allowed_hosts: []
    browser:
      required: true
      session_strategy: reuse
      claude_provider: chrome-devtools-mcp
      codex_provider: current-browser-session
      pi_provider: "@injaneity/pi-computer-use@0.4.3"

i18n:
  locale_dir: "i18n/"
  conclusion_pass: "PASS"
  conclusion_fail: "NEEDS_REVISION"
  acceptance_pass: "通过"
  acceptance_fail: "未通过"
  test_pass: "通过"
  test_fail: "阻塞"
